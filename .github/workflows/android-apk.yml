name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Debug APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx3g -Dorg.gradle.kotlin.dsl.jvmTarget=17"
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug -Pkotlin.jvm.target=17 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalAnalyzer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
